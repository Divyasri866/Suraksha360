<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Suraksha360</title>
  <link rel="stylesheet" href="css/auth.css">
  <link rel="icon" type="image/svg+xml" href="assets/images/logo.svg">
</head>
<body>
  <div class="container">
    <div class="auth-brand">
      <img src="assets/images/logo.svg" alt="Suraksha360 Logo">
      <h1>Suraksha360</h1>
    </div>

    <h2>Welcome Back</h2>
    <p class="subtitle">Sign in to manage your emergency devices &amp; preferences</p>

    <form action="index.html" method="get">
      <div>
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="name@example.com" required>
      </div>

      <div>
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>

      <button type="submit">Sign In to Safety Portal</button>

      <div class="toggle">
        Don't have an account?
        <a href="signup.html">Create Account</a>
      </div>
    </form>

    <a href="index.html" class="back-home">&larr; Return to Homepage</a>
  </div>
</body>
</html>
