<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9C27B0" />
      <stop offset="50%" stop-color="#E91E63" />
      <stop offset="100%" stop-color="#FF5722" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD54F" />
      <stop offset="100%" stop-color="#FF8A65" />
    </linearGradient>
  </defs>
  <!-- Background Shield Glow -->
  <circle cx="100" cy="100" r="92" fill="#FFFFFF" stroke="#F8BBD0" stroke-width="4" />
  
  <!-- Outer Safety Circle -->
  <circle cx="100" cy="100" r="82" fill="none" stroke="url(#shieldGrad)" stroke-width="3" stroke-dasharray="6,4" />
  
  <!-- Dual Interlocking Safety Bangles -->
  <circle cx="85" cy="100" r="42" fill="none" stroke="url(#shieldGrad)" stroke-width="8" opacity="0.9" />
  <circle cx="115" cy="100" r="42" fill="none" stroke="url(#glowGrad)" stroke-width="8" opacity="0.9" />
  
  <!-- Central SOS Protection Node -->
  <circle cx="100" cy="100" r="16" fill="url(#shieldGrad)" />
  <path d="M100 89 L100 102 M100 108 L100 111" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
  
  <!-- GPS Waves -->
  <path d="M80 62 A 48 48 0 0 1 120 62" fill="none" stroke="#E91E63" stroke-width="3.5" stroke-linecap="round" />
  <path d="M72 52 A 60 60 0 0 1 128 52" fill="none" stroke="#9C27B0" stroke-width="3.5" stroke-linecap="round" />
  
  <!-- Small Emblem Text -->
  <text x="100" y="160" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#880E4F" letter-spacing="2">SURAKSHA360</text>
  <text x="100" y="174" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" fill="#AD1457" letter-spacing="1">WOMEN SAFETY IoT</text>
</svg>
