<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emergency Contacts — Suraksha360</title>
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="icon" type="image/svg+xml" href="assets/images/logo.svg">
</head>
<body>
  <header class="topbar">
    <a href="profile.html" class="back" title="Back to Settings">&larr;</a>
    <h2>Family &amp; Friends Contacts</h2>
    <img src="assets/images/logo.svg" alt="Suraksha360 Logo" class="logoimg">
  </header>

  <main class="content">
    <!-- Active Emergency Contacts List -->
    <section class="section">
      <h3>
        <img src="assets/icons/phone.svg" alt="" width="20" height="20">
        Emergency Hotline List
      </h3>
      <ul class="contact-list" id="contactList">
        <!-- Rendered dynamically by js/app.js -->
        <li>
          <div class="contact-info">
            <span class="contact-name">Mom</span>
            <span class="contact-number">+91 9876543210</span>
          </div>
          <div class="contact-actions">
            <a href="tel:+919876543210" class="call-button">📞 Call</a>
            <button class="delete-button">Delete</button>
          </div>
        </li>
        <li>
          <div class="contact-info">
            <span class="contact-name">Bestie</span>
            <span class="contact-number">+91 9988776655</span>
          </div>
          <div class="contact-actions">
            <a href="tel:+919988776655" class="call-button">📞 Call</a>
            <button class="delete-button">Delete</button>
          </div>
        </li>
        <li>
          <div class="contact-info">
            <span class="contact-name">Police Station</span>
            <span class="contact-number">100</span>
          </div>
          <div class="contact-actions">
            <a href="tel:100" class="call-button">📞 Call</a>
            <button class="delete-button">Delete</button>
          </div>
        </li>
      </ul>
    </section>

    <!-- Add New Contact Form -->
    <section class="section">
      <h3>Add New Trusted Contact</h3>
      <form class="contact-form" id="contactForm">
        <label for="contactName">Contact Name</label>
        <input type="text" id="contactName" placeholder="e.g. Dad, Sister, Neighbor" required>
        
        <label for="contactPhone">Phone Number</label>
        <input type="tel" id="contactPhone" placeholder="e.g. +91 9876543210" required>
        
        <button type="submit">➕ Add to Emergency List</button>
      </form>
    </section>
  </main>

  <footer class="queries">
    <p>Suraksha360 Emergency Dispatch</p>
    <a href="tel:919494617277">+91 9494617277</a>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
