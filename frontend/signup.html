<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — Suraksha360</title>
  <link rel="stylesheet" href="css/auth.css">
  <link rel="icon" type="image/svg+xml" href="assets/images/logo.svg">
</head>
<body>
  <div class="container">
    <div class="auth-brand">
      <img src="assets/images/logo.svg" alt="Suraksha360 Logo">
      <h1>Suraksha360</h1>
    </div>

    <h2>Create Safety Account</h2>
    <p class="subtitle">Register to pair your wearable bangles and setup emergency contacts</p>

    <form action="signin.html" method="get">
      <div>
        <label for="fullname">Full Name</label>
        <input type="text" id="fullname" placeholder="Enter your full name" required>
      </div>

      <div>
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="name@example.com" required>
      </div>

      <div>
        <label for="password">Create Password</label>
        <input type="password" id="password" placeholder="At least 8 characters" required>
      </div>

      <button type="submit">Complete Registration</button>

      <div class="toggle">
        Already have an account?
        <a href="signin.html">Sign In</a>
      </div>
    </form>

    <a href="index.html" class="back-home">&larr; Return to Homepage</a>
  </div>
</body>
</html>
