<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe — Casual Game</title>
  <link rel="stylesheet" href="css/game.css">
  <link rel="icon" type="image/svg+xml" href="assets/icons/game.svg">
</head>
<body>
  <nav>
    <ul>
      <li>🎮 MyTicTacToe.com</li>
    </ul>
    <span style="font-size: 0.85rem; opacity: 0.8;">Casual Stealth Mode</span>
  </nav>

  <h1 class="main-heading">Welcome to Tic Tac Toe</h1>

  <div class="gameContainer">
    <div class="container">
      <div class="line"></div>
      <div class="box bt-0 bl-0"><span class="boxtext"></span></div>
      <div class="box bt-0"><span class="boxtext"></span></div>
      <div class="box bt-0 br-0"><span class="boxtext"></span></div>
      <div class="box bl-0"><span class="boxtext"></span></div>
      <div class="box"><span class="boxtext"></span></div>
      <div class="box br-0"><span class="boxtext"></span></div>
      <div class="box bl-0 bb-0"><span class="boxtext"></span></div>
      <div class="box bb-0"><span class="boxtext"></span></div>
      <div class="box bb-0 br-0"><span class="boxtext"></span></div>
    </div>
  </div>

  <div class="controls">
    <span class="info">Turn for X</span>
    <button id="reset">Reset Game</button>
  </div>

  <div class="imgbox">
    <!-- Visual celebratory placeholder -->
  </div>

  <!-- Stealth Switch to safety dashboard -->
  <a href="signin.html" id="switch" title="Switch to Safety Portal">
    🛡️ Switch to Safety Portal
  </a>

  <script src="js/game.js"></script>
</body>
</html>
